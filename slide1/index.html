function toggleRenderMode() {
  renderMode = renderMode === 'points' ? 'polygons' : 'points';
  // build polygon geometry lazily the first time polygons are shown
  if (renderMode === 'polygons' && hasPolygons && !polygonData) {
    setLoadingText && setLoadingText('Building polygon geometry...');
    buildPolygonData();
  }
  const toggle = document.getElementById('poly-toggle');
  toggle.classList.toggle('active', renderMode === 'polygons');

  // Show/hide relevant sliders
  document.getElementById('point-size-row').style.display = renderMode === 'points' ? 'flex' : 'none';
  document.getElementById('poly-outline-row').style.display = renderMode === 'polygons' ? 'flex' : 'none';

  updateLayer();
}

function setPolyOutline(val) {
  polyOutlineWidth = Number(val);
  document.getElementById('poly-outline-val').textContent = val;
  updateLayer();
}

// ============================================================================
// Tooltip
// ============================================================================
function getTooltipInfo({index, object}) {
  // For polygon mode, object has .index; for point mode, use index directly
  let cellIdx;
  if (renderMode === 'polygons' && object) {
    cellIdx = object.index;
  } else {
    cellIdx = index;
  }
  if (cellIdx == null || cellIdx < 0 || !cellData) return null;

  const ct = getCelltype(cellIdx);
  if (celltypeVisible[ct] === false) return null;

  let html = `<div class="tt-label">Cell ID</div><div class="tt-value">${cellData.cell_id[cellIdx]}</div>`;
  html += `<div class="tt-label">Cell Type</div><div class="tt-value">${ct}</div>`;
  const hp = hierParentNameOf(ct);
  if (hp && hp !== ct) html += `<div class="tt-label">Major</div><div class="tt-value">${hp}</div>`;
  scoreCols.forEach(k => {
    const v = cellData[k][cellIdx];
    html += `<div class="tt-label">${k}</div><div class="tt-value">${v == null ? 'NA' : Number(v).toFixed(2)}</div>`;
  });

  const ann = getAnnotation(ct);
  if (ann) {
    const conf = ann.confidence ? ` <span style="color:#888">(${ann.confidence})</span>` : '';
    html += `<div class="tt-label">Annotation</div><div class="tt-value">${ann.annotation}${conf}</div>`;
    if (ann.note) html += `<div class="tt-value" style="color:#e9a145;white-space:normal">⚠ ${ann.note}</div>`;
  }

  if (currentMode === 'expression' && currentGeneExpr) {
    const val = currentGeneExpr.dense[cellIdx];
    const label = currentProtein || currentGene;
    const formatted = Number.isNaN(val) ? 'NA' : (Math.abs(val) >= 100 ? Math.round(val).toString() : val.toFixed(3));
    html += `<div class="tt-label">${label}</div><div class="tt-value">${formatted}</div>`;
  }

  return { html, style: { backgroundColor: 'rgba(22,33,62,0.95)', color: '#e0e0e0', border: '1px solid #0f3460', borderRadius: '6px', padding: '8px 12px', fontSize: '12px' } };
}

// ============================================================================
// Label annotations
// metadata.label_annotations: label -> {annotation, n_cells, markers, [confidence],
// [note]}, written by 07_viewer.R. Absent for labels with no marker list.
// ============================================================================
function getAnnotation(ct) {
  const map = metadata && metadata.label_annotations;
  if (!map) return null;
  const a = map[ct];
  return (a && a.annotation) ? a : null;
}

function annotationTitle(ct) {
  const a = getAnnotation(ct);
  if (!a) return ct;
  let t = `${ct} — ${a.annotation}`;
  if (a.confidence) t += ` (reference confidence: ${a.confidence})`;
  if (a.note) t += `\n\n⚠ ${a.note}`;
  return t;
}

// ============================================================================
// Cell Type UI
// ============================================================================
function buildCelltypeUI() {
  const listEl = document.getElementById('celltype-list');
  const listExprEl = document.getElementById('celltype-list-expr');
  listEl.innerHTML = '';
  listExprEl.innerHTML = '';

  // Past ~12 categories no palette keeps groups apart (lab rule 6.2). Say so in
  // the legend rather than render something that looks fine and is not readable.
  const nRows = annLevels(currentAnnotation).length;
  if (nRows > 12) {
    const w = document.createElement('div');
    w.className = 'ct-crowded';
    w.innerHTML = '<b>' + nRows + ' rows.</b> Past ~12 colours stop being tellable apart' +
      '. Collapse what you are not comparing, or set colours by hand on the rows you are.';
    listEl.appendChild(w);
  }

  // Count cells per type
  const counts = {};
  // Count over the integer codes and map once. Decoding 646k strings on every UI
  // rebuild would give back exactly what the coding was for.
  const arr = cellData[currentAnnotation], lv = annLevels(currentAnnotation);
  if (arr.length && typeof arr[0] === 'string') {
    arr.forEach(ct => { counts[ct] = (counts[ct] || 0) + 1; });
  } else {
    const byCode = new Int32Array(lv.length);
    for (let i = 0; i < arr.length; i++) { const c = arr[i]; if (c >= 0 && c < lv.length) byCode[c]++; }
    for (let c = 0; c < lv.length; c++) if (byCode[c]) counts[lv[c]] = byCode[c];
  }
  // A header row owns no cells of its own; show the total of its subtypes so a
  // collapsed and an expanded major report the same number.
  derivedHeaders.forEach(h => {
    counts[h] = hierChildLabels(h).reduce((a, c) => a + (counts[c] || 0), 0);
  });

  metadata.cell_types.forEach(ct => {
    const row = createCelltypeRow(ct, counts[ct] || 0);
    listEl.appendChild(row);
    listExprEl.appendChild(row.cloneNode(true));
  });

  // The chevron is bound ONCE per container by delegation, not per row. The
  // clone path below re-binds only three controls and already drops .ct-mk and
  // the label click; adding a fourth thing to it is how that bug grows.
  [listEl, listExprEl].forEach(host => {
    if (host.dataset.exBound) return;
    host.dataset.exBound = '1';
    host.addEventListener('click', e => {
      const b = e.target.closest('.ct-ex');
      if (b && b.dataset.expand) {
        e.stopPropagation();
        setExpanded(b.dataset.expand, !hierIsHeaderRow(b.dataset.expand));
        return;
      }
      // Header rows are built without per-element listeners, so their `genes`
      // button is delegated here too.
      const mk = e.target.closest('.ct-mk');
      const hr = e.target.closest('.ct-row[data-level="header"]');
      if (mk && hr) { e.stopPropagation(); showMarkers(hr.dataset.celltype); }
    });
    host.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset && t.dataset.headerToggle) setHeaderVisible(t.dataset.headerToggle, t.checked);
    });
  });

  // Re-attach events for cloned nodes in expr list
  listExprEl.querySelectorAll('.ct-row').forEach(row => {
    const ct = row.dataset.celltype;
    row.querySelector('input[type="checkbox"]').addEventListener('change', (e) => {
      celltypeVisible[ct] = e.target.checked;
      syncCheckboxes(ct);
      rebuildHighlightIdx();
      updateLayer();
    });
    row.querySelector('input[type="color"]').addEventListener('input', (e) => {
      celltypeColors[ct] = hexToRgb(e.target.value);
      syncColorPickers(ct);
      saveColorPreferences();
      updateLayer();
    });
    const hlBtn = row.querySelector('.ct-hl');
    if (hlBtn) hlBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleHighlightLabel(ct); });
  });
}

function createCelltypeRow(ct, count) {
  const row = document.createElement('div');
  row.className = 'ct-row';
  row.dataset.celltype = ct;

  // Expander. A single-subtype lineage's leaf IS its major, so expanding it
  // would redraw the same row -- no chevron there (the exporter skips those
  // lineages for the same reason).
  const isP = hierIsParentRow(ct), kids = hierChildCount(ct), isHdr = hierIsHeaderRow(ct);
  row.dataset.level = hierInfo() ? (isHdr ? 'header' : (isP ? 'parent' : 'leaf')) : 'flat';
  const ex = document.createElement('button');
  ex.className = 'ct-ex' + ((isP && kids > 1) ? '' : ' ct-ex-leaf');
  if (isP && kids > 1) {
    ex.textContent = isHdr ? '\u25BE' : '\u25B8';
    ex.dataset.expand = ct;
    ex.title = (isHdr ? 'Collapse ' : 'Expand ') + ct + ' (' + kids + ' subtypes)';
  } else { ex.disabled = true; }
  row.appendChild(ex);

  // A header carries the chevron, a cascading checkbox, its name, the summed
  // count and (if it has one) its marker list. No colour picker: its subtypes
  // own their colours, and no highlight ring: which cells it would ring is
  // ambiguous while it is expanded. Collapse it to get both back.
  if (isHdr) {
    const hcb = document.createElement('input');
    hcb.type = 'checkbox';
    hcb.checked = celltypeVisible[ct] !== false;
    hcb.title = 'Show/hide every subtype of ' + ct;
    hcb.dataset.headerToggle = ct;
    row.appendChild(hcb);
    const hl2 = document.createElement('span');
    hl2.className = 'ct-label';
    const hn = document.createElement('div');
    hn.className = 'ct-name';
    hn.textContent = ct;
    hl2.appendChild(hn);
    if (getMarkers(ct).length) {
      const hmk = document.createElement('button');
      hmk.className = 'ct-mk';
      hmk.textContent = 'genes';
      hmk.title = 'Show this label\u2019s top marker genes';
      hl2.appendChild(hmk);
    }
    row.appendChild(hl2);
    const hc = document.createElement('span');
    hc.className = 'ct-count';
    hc.textContent = count.toLocaleString();
    row.appendChild(hc);
    return row;
  }

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = celltypeVisible[ct] !== false;
  cb.addEventListener('change', () => {
    celltypeVisible[ct] = cb.checked;
    syncCheckboxes(ct);
    rebuildHighlightIdx();   // hidden cells must drop out of the highlight set
    updateLayer();
  });

  const hl = document.createElement('button');
  hl.className = 'ct-hl' + (highlightLabels[ct] ? ' active' : '');
  hl.textContent = '◎';
  hl.title = 'Highlight these cells (draws an enlarged ring around each one)';
  hl.addEventListener('click', (e) => { e.stopPropagation(); toggleHighlightLabel(ct); });

  const cp = document.createElement('input');
  cp.type = 'color';
  cp.value = rgbToHex(celltypeColors[ct] || [128, 128, 128]);
  cp.addEventListener('input', () => {
    celltypeColors[ct] = hexToRgb(cp.value);
    syncColorPickers(ct);
    saveColorPreferences();
    updateLayer();
  });

  const label = document.createElement('span');
  label.className = 'ct-label';
  const nameEl = document.createElement('div');
  nameEl.className = 'ct-name';
  nameEl.textContent = ct;
  label.appendChild(nameEl);

  // Second line: what the cluster code actually is, biologically.
  const ann = getAnnotation(ct);
  if (ann) {
    const annEl = document.createElement('div');
    annEl.className = 'ct-annot' + (ann.note ? ' flagged' : '');
    annEl.textContent = (ann.note ? '⚠ ' : '') + ann.annotation;
    label.appendChild(annEl);
  }
  label.title = annotationTitle(ct);
  label.addEventListener('click', () => {
    cb.checked = !cb.checked;
    celltypeVisible[ct] = cb.checked;
    syncCheckboxes(ct);
    rebuildHighlightIdx();
    updateLayer();
  });

  // A dedicated button rather than hijacking the label click, which already toggles
  // visibility and is the more frequent action.
  if (getMarkers(ct).length) {
    const mk = document.createElement('button');
    mk.className = 'ct-mk';
    mk.textContent = 'genes';
    mk.title = 'Show this label\u2019s top marker genes';
    mk.addEventListener('click', (e) => { e.stopPropagation(); showMarkers(ct); });
    label.appendChild(mk);
  }

  const countEl = document.createElement('span');
  countEl.className = 'ct-count';
  countEl.textContent = count.toLocaleString();

  row.appendChild(cb);
  row.appendChild(cp);
  row.appendChild(hl);
  row.appendChild(label);
  row.appendChild(countEl);
  return row;
}

// ============================================================================
// Marker genes per label
// ============================================================================
function getMarkers(ct) {
  const map = metadata && metadata.label_annotations;
  const a = map && map[ct];
  return (a && Array.isArray(a.markers)) ? a.markers : [];
}

function hideMarkers() { document.getElementById('marker-section').style.display = 'none'; }

// Clicking a gene switches to expression mode and loads it, so the marker list is a
// way to navigate the data rather than just something to read.
function showMarkers(ct) {
  const genes = getMarkers(ct);
  if (!genes.length) return;
  document.getElementById('marker-title').textContent = 'Top ' + genes.length + ' markers';
  const ann = getAnnotation(ct);
  let sub = ct;
  if (ann && ann.n_cells) sub += ' \u00b7 ' + ann.n_cells.toLocaleString() + ' cells';
  document.getElementById('marker-sub').textContent = sub;

  const host = document.getElementById('marker-list');
  host.innerHTML = '';
  genes.forEach((g, i) => {
    const name = (typeof g === 'string') ? g : g.gene;
    const chip = document.createElement('button');
    chip.className = 'mk-chip';
    chip.textContent = (i + 1) + '. ' + name;
    // A marker is not necessarily in the exported gene set (max_genes caps it), so say
    // so rather than offering a click that silently does nothing.
    const stats = (typeof g === 'object' && g.lfc != null)
      ? ` (log2FC ${g.lfc}, pct.1 ${g.pct1}, pct.2 ${g.pct2})` : '';
    if (geneList && Object.prototype.hasOwnProperty.call(geneList, name)) {
      chip.title = 'Colour cells by ' + name + stats;
      chip.addEventListener('click', () => { setMode('expression'); loadGene(name); });
    } else {
      chip.classList.add('mk-absent');
      chip.title = name + stats + ' is a marker for this label but was not exported to this viewer (viewer$max_genes)';
    }
    host.appendChild(chip);
  });
  document.getElementById('marker-section').style.display = 'block';
}

function syncCheckboxes(ct) {
  document.querySelectorAll(`.ct-row[data-celltype="${CSS.escape(ct)}"] input[type="checkbox"]`).forEach(cb => {
    cb.checked = celltypeVisible[ct] !== false;
  });
}

function syncColorPickers(ct) {
  const hex = rgbToHex(celltypeColors[ct] || [128, 128, 128]);
  document.querySelectorAll(`.ct-row[data-celltype="${CSS.escape(ct)}"] input[type="color"]`).forEach(cp => {
    cp.value = hex;
  });
}

function toggleAll(state) {
  metadata.cell_types.forEach(ct => { celltypeVisible[ct] = state; });
  document.querySelectorAll('.ct-row input[type="checkbox"]').forEach(cb => { cb.checked = state; });
  rebuildHighlightIdx();
  updateLayer();
}

// ============================================================================
// Mode Switch
// ============================================================================
function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-celltype').classList.toggle('active', mode === 'celltype');
  document.getElementById('mode-expression').classList.toggle('active', mode === 'expression');
  document.getElementById('celltype-section').style.display = mode === 'celltype' ? 'block' : 'none';
  document.getElementById('gene-section').style.display = mode === 'expression' ? 'block' : 'none';
  updateLayer();
  updateHash();
}

// ============================================================================
// Gene Search
// ============================================================================
function buildGeneSearch() {
  const input = document.getElementById('gene-search');
  const dropdown = document.getElementById('gene-dropdown');
  const geneNames = Object.keys(geneList).sort();
  let highlighted = -1;

  input.addEventListener('input', () => {
    const query = input.value.toLowerCase().trim();
    dropdown.innerHTML = '';
    highlighted = -1;

    if (query.length === 0) {
      dropdown.style.display = 'none';
      return;
    }

    // Prioritize: starts-with first, then contains
    const startsWith = geneNames.filter(g => g.toLowerCase().startsWith(query));
    const contains = geneNames.filter(g => !g.toLowerCase().startsWith(query) && g.toLowerCase().includes(query));
    const matches = [...startsWith, ...contains].slice(0, 50);

    if (matches.length === 0) {
      dropdown.style.display = 'none';
      return;
    }

    matches.forEach((gene, i) => {
      const opt = document.createElement('div');
      opt.className = 'gene-option';
      opt.textContent = gene;
      opt.addEventListener('click', () => loadGene(gene));
      opt.addEventListener('mouseenter', () => {
        highlighted = i;
        updateHighlight();
      });
      dropdown.appendChild(opt);
    });
    dropdown.style.display = 'block';
  });

  input.addEventListener('keydown', (e) => {
    const options = dropdown.querySelectorAll('.gene-option');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      highlighted = Math.min(highlighted + 1, options.length - 1);
      updateHighlight();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      highlighted = Math.max(highlighted - 1, 0);
      updateHighlight();
    } else if (e.key === 'Enter' && highlighted >= 0) {
      e.preventDefault();
      options[highlighted]?.click();
    } else if (e.key === 'Escape') {
      dropdown.style.display = 'none';
    }
  });

  function updateHighlight() {
    dropdown.querySelectorAll('.gene-option').forEach((opt, i) => {
      opt.classList.toggle('highlighted', i === highlighted);
      if (i === highlighted) opt.scrollIntoView({ block: 'nearest' });
    });
  }

  // Close dropdown on outside click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#gene-search') && !e.target.closest('#gene-dropdown')) {
      dropdown.style.display = 'none';
    }
  });
}

async function loadGene(geneName) {
  const filename = geneList[geneName];
  if (!filename) return;

  // Clear active protein
  clearProtein(true);

  document.getElementById('gene-search').value = geneName;
  document.getElementById('gene-dropdown').style.display = 'none';

  // Show loading state
  document.getElementById('current-gene').innerHTML = `Loading <strong>${geneName}</strong>...`;

  try {
    const resp = await fetch(`data/genes/${filename}`);
    const sparse = await resp.json();

    // Expand sparse to dense
    const N = sparse.n;
    const dense = new Float32Array(N);
    let maxVal = 0;
    for (let j = 0; j < sparse.idx.length; j++) {
      dense[sparse.idx[j]] = sparse.val[j];
      if (sparse.val[j] > maxVal) maxVal = sparse.val[j];
    }

    // Use 99th percentile for color scale to avoid outlier compression
    const nonzero = sparse.val.slice().sort((a, b) => a - b);
    const p99idx = Math.floor(nonzero.length * 0.99);
    const p99 = nonzero[p99idx] || maxVal;

    currentGene = geneName;
    currentGeneExpr = { dense, maxVal: p99 };

    // Update UI
    document.getElementById('current-gene').innerHTML =
      `Showing: <strong>${geneName}</strong> <button id="clear-gene-btn" onclick="clearGene()">Clear</button>`;
    document.getElementById('expression-legend').style.display = 'block';
    document.getElementById('legend-min').textContent = '0';
    document.getElementById('legend-max').textContent = p99.toFixed(2);
    updateLegendGradient();

    updateLayer();
    updateHash();
  } catch (err) {
    document.getElementById('current-gene').innerHTML = `<span style="color:#e94560">Error loading ${geneName}</span>`;
  }
}

function clearGene() {
  currentGene = null;
  currentGeneExpr = null;
  currentProtein = null;
  document.getElementById('gene-search').value = '';
  document.getElementById('current-gene').innerHTML = '';
  document.getElementById('expression-legend').style.display = 'none';
  // Deactivate protein buttons
  document.querySelectorAll('.protein-btn.active').forEach(b => b.classList.remove('active'));
  updateLayer();
  updateHash();
}

// ============================================================================
// Protein Markers
// ============================================================================
function buildProteinButtons() {
  if (!proteinList || Object.keys(proteinList).length === 0) return;

  const section = document.getElementById('protein-section');
  const container = document.getElementById('protein-buttons');
  section.style.display = 'block';

  const names = Object.keys(proteinList).sort();
  const grid = document.createElement('div');
  grid.className = 'protein-grid';

  names.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'protein-btn';
    btn.textContent = name;
    btn.title = name;
    btn.dataset.protein = name;
    btn.addEventListener('click', () => loadProtein(name));
    grid.appendChild(btn);
  });

  container.appendChild(grid);
}

// Transfer scores live in cells.json already (also shown in the tooltip), so a
// score overlay is built in memory -- no extra file. null (no subtype call, i.e. a
// passthrough lineage) becomes NaN and is drawn like a zero.
function buildScoreButtons() {
  if (!scoreCols.length) return;
  document.getElementById('score-section').style.display = 'block';
  const grid = document.createElement('div');
  grid.className = 'protein-grid';
  scoreCols.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'protein-btn';
    btn.textContent = name;
    btn.dataset.protein = name;
    btn.addEventListener('click', () => loadScore(name));
    grid.appendChild(btn);
  });
  document.getElementById('score-buttons').appendChild(grid);
}

function loadScore(name) {
  const src = cellData[name];
  const dense = new Float32Array(src.length);
  for (let i = 0; i < src.length; i++) dense[i] = (src[i] == null) ? NaN : src[i];
  currentGene = name;
  currentGeneExpr = { dense, maxVal: 1 };
  currentProtein = name;
  document.getElementById('gene-search').value = '';
  document.getElementById('current-gene').innerHTML =
    `Showing: <strong>${name}</strong> <button id="clear-gene-btn" onclick="clearGene()">Clear</button>`;
  document.getElementById('expression-legend').style.display = 'block';
  document.getElementById('legend-min').textContent = '0';
  document.getElementById('legend-max').textContent = '1';
  updateLegendGradient();
  document.querySelectorAll('.protein-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.protein === name);
  });
  updateLayer();
  updateHash();
}

async function loadProtein(name) {
  const filename = proteinList[name];
  if (!filename) return;

  // Show loading
  document.getElementById('current-gene').innerHTML = `Loading <strong>${name}</strong>...`;

  try {
    const resp = await fetch(`data/proteins/${filename}`);
    const sparse = await resp.json();

    // Expand sparse to dense
    const N = sparse.n;
    const dense = new Float32Array(N);
    let maxVal = 0;
    for (let j = 0; j < sparse.idx.length; j++) {
      dense[sparse.idx[j]] = sparse.val[j];
      if (sparse.val[j] > maxVal) maxVal = sparse.val[j];
    }

    // Use 99th percentile for color scale
    const nonzero = sparse.val.slice().sort((a, b) => a - b);
    const p99idx = Math.floor(nonzero.length * 0.99);
    const p99 = nonzero[p99idx] || maxVal;

    // Reuse expression rendering pipeline
    currentGene = name;
    currentGeneExpr = { dense, maxVal: p99 };
    currentProtein = name;

    // Update UI
    document.getElementById('gene-search').value = '';
    document.getElementById('current-gene').innerHTML =
      `Showing: <strong>${name}</strong> <button id="clear-gene-btn" onclick="clearGene()">Clear</button>`;
    document.getElementById('expression-legend').style.display = 'block';
    document.getElementById('legend-min').textContent = '0';
    document.getElementById('legend-max').textContent = p99 >= 100 ? Math.round(p99).toString() : p99.toFixed(2);
    updateLegendGradient();

    // Highlight active button
    document.querySelectorAll('.protein-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.protein === name);
    });

    updateLayer();
    updateHash();
  } catch (err) {
    document.getElementById('current-gene').innerHTML = `<span style="color:#e94560">Error loading ${name}</span>`;
  }
}

function clearProtein(skipUpdate) {
  currentProtein = null;
  document.querySelectorAll('.protein-btn.active').forEach(b => b.classList.remove('active'));
  if (!skipUpdate) {
    clearGene();
  }
}

// ============================================================================
// Colormap Selection
// ============================================================================
function loadColormapPreference() {
  let saved = null;
  try { saved = localStorage.getItem(storeKey('colormap')); } catch (e) { saved = null; }
  if (saved && COLORMAPS[saved]) {
    currentColormap = saved;
    document.getElementById('colormap-select').value = saved;
  }

  document.getElementById('colormap-select').addEventListener('change', (e) => {
    currentColormap = e.target.value;
    try { localStorage.setItem(storeKey('colormap'), currentColormap); } catch (e) { /* storage blocked */ }
    updateLegendGradient();
    if (currentGeneExpr) updateLayer();
  });
}

function updateLegendGradient() {
  const stops = COLORMAPS[currentColormap] || COLORMAPS.viridis;
  const cssStops = stops.map(rgb => `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`).join(', ');
  document.getElementById('legend-gradient').style.background = `linear-gradient(to right, ${cssStops})`;
}

// ============================================================================
// Point Size
// ============================================================================
function setPointSize(val) {
  pointRadius = Number(val);
  document.getElementById('point-size-val').textContent = val;
  updateLayer();
}

// ============================================================================
// Reset View
// ============================================================================
function resetView() {
  if (!deckgl || !metadata) return;
  const bounds = metadata.bounds;
  const cx = (bounds.x_min + bounds.x_max) / 2;
  const cy = (bounds.y_min + bounds.y_max) / 2;
  const container = document.getElementById('deck-canvas');
  const rangeX = bounds.x_max - bounds.x_min;
  const rangeY = bounds.y_max - bounds.y_min;
  const zoom = Math.log2(Math.min(container.clientWidth / rangeX, container.clientHeight / rangeY)) - 0.5;

  deckgl.setProps({
    initialViewState: {
      target: [cx, cy, 0],
      zoom: zoom,
      minZoom: -10,
      maxZoom: 10,
      transitionDuration: 500
    }
  });
}

// ============================================================================
// Screenshot
// ============================================================================
function takeScreenshot() {
  if (!deckgl) return;
  captureScreenshot = true;
  deckgl.redraw(true);
}

function saveCanvasWithBackground(srcCanvas) {
  const w = srcCanvas.width, h = srcCanvas.height;
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = w; tmpCanvas.height = h;
  const ctx = tmpCanvas.getContext('2d');
  // Draw background color first
  ctx.fillStyle = `rgb(${bgColor[0]},${bgColor[1]},${bgColor[2]})`;
  ctx.fillRect(0, 0, w, h);
  // Draw deck.gl canvas on top
  ctx.drawImage(srcCanvas, 0, 0);
  const link = document.createElement('a');
  link.download = `${metadata.dataset_name.replace(/\s+/g, '_')}_screenshot.png`;
  link.href = tmpCanvas.toDataURL('image/png');
  link.click();
}

// ============================================================================
// URL Hash for sharing views
// ============================================================================
function updateHash(viewState) {
  const params = new URLSearchParams();
  if (viewState) {
    params.set('x', Math.round(viewState.target[0]));
    params.set('y', Math.round(viewState.target[1]));
    params.set('z', viewState.zoom.toFixed(2));
  }
  if (currentMode !== 'celltype') params.set('mode', currentMode);
  if (currentProtein) {
    params.set('protein', currentProtein);
  } else if (currentGene) {
    params.set('gene', currentGene);
  }
  if (renderMode !== 'points') params.set('render', renderMode);
  // Annotation layer and label highlights, so a highlighted view is shareable.
  // Pasted cell-ID sets are deliberately NOT serialised — they can run to
  // thousands of IDs and would blow the URL length.
  if (currentAnnotation !== DEFAULT_ANNOTATION) params.set('ann', currentAnnotation);
  // Which majors are expanded, so a shared link reproduces a MIXED view.
  if (hierExpanded.size) params.set('ex', Array.from(hierExpanded).join('~'));
  const hlKeys = Object.keys(highlightLabels);
  if (hlKeys.length) {
    params.set('hl', hlKeys.join('~'));
    params.set('hls', String(highlightScale));
  }
  const hash = params.toString();
  if (hash) history.replaceState(null, '', '#' + hash);
}

function restoreFromHash() {
  const hash = window.location.hash.slice(1);
  if (!hash) return;
  const params = new URLSearchParams(hash);

  if (params.get('render') === 'polygons' && hasPolygons) {
    toggleRenderMode();
  }
  // Annotation layer must be restored BEFORE the highlight labels, because
  // switchAnnotation() clears highlightLabels by design.
  if (params.has('ann') && metadata.annotations && metadata.annotations[params.get('ann')]) {
    const sel = document.getElementById('annotation-select');
    if (sel) sel.value = params.get('ann');
    switchAnnotation(params.get('ann'));
  }
  // Expansion must be restored AFTER the `ann` branch above (switchAnnotation
  // clears it) and BEFORE `hl` below: a shared link whose highlight is a
  // subtype needs that subtype's row to exist first.
  if (params.has('ex') && hierInfo()) {
    const ok = new Set(hierParents);
    params.get('ex').split('~').filter(x => ok.has(x)).forEach(x => hierExpanded.add(x));
    if (hierExpanded.size) {
      rebuildDerived();
      const saved = savedColors();
      metadata.cell_types.forEach(ct => {
        if (celltypeColors[ct] === undefined) celltypeColors[ct] = saved[ct] || defaultColorFor(ct);
        if (celltypeVisible[ct] === undefined) celltypeVisible[ct] = true;
      });
      buildCelltypeUI(); updateSelectionSummary(); updateLayer();
    }
  }
  if (params.has('hls')) {
    highlightScale = Number(params.get('hls')) || 3;
    const s = document.getElementById('highlight-scale-slider');
    if (s) { s.value = highlightScale; }
    const v = document.getElementById('highlight-scale-val');
    if (v) v.textContent = highlightScale;
  }
  if (params.has('hl')) {
    highlightLabels = {};
    params.get('hl').split('~').filter(Boolean).forEach(ct => { highlightLabels[ct] = true; });
    Object.keys(highlightLabels).forEach(syncHighlightButtons);
    rebuildHighlightIdx();
    updateLayer();
  }
  if (params.has('mode')) setMode(params.get('mode'));
  if (params.has('protein') && scoreCols.includes(params.get('protein'))) {
    setMode('expression');
    loadScore(params.get('protein'));
  } else if (params.has('protein') && proteinList && proteinList[params.get('protein')]) {
    setMode('expression');
    loadProtein(params.get('protein'));
  } else if (params.has('gene')) {
    setMode('expression');
    loadGene(params.get('gene'));
  }

  if (params.has('x') && params.has('y') && params.has('z')) {
    const target = [Number(params.get('x')), Number(params.get('y')), 0];
    const zoom = Number(params.get('z'));
    deckgl.setProps({
      initialViewState: { target, zoom, minZoom: -10, maxZoom: 10 }
    });
  }
}

// ============================================================================
// Color Utilities
// ============================================================================
function rgbToHex(rgb) {
  return '#' + rgb.map(c => c.toString(16).padStart(2, '0')).join('');
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return [r, g, b];
}

// ============================================================================
// Background Color
// ============================================================================
let bgColor = [26, 26, 46]; // default #1a1a2e

function setBgColor(hex) {
  bgColor = hexToRgb(hex);
  document.getElementById('bg-color-label').textContent = hex;
  document.getElementById('deck-container').style.background = hex;
  document.body.style.background = hex;
  try { localStorage.setItem(storeKey('bg'), hex); } catch (e) { /* storage blocked */ }
}

function loadBgColor() {
  let saved = null;
  try { saved = localStorage.getItem(storeKey('bg')); } catch (e) { saved = null; }
  if (saved) {
    document.getElementById('bg-color-picker').value = saved;
    setBgColor(saved);
  }
}

// ============================================================================
// Selection Summary
// ============================================================================
function updateSelectionSummary() {
  const el = document.getElementById('selection-summary');
  if (!metadata || !cellData) { el.innerHTML = ''; return; }

  const selectedTypes = metadata.cell_types.filter(ct => celltypeVisible[ct] !== false);
  const totalTypes = metadata.cell_types.length;

  // Count visible cells
  let visibleCells = 0;
  const N = cellData[currentAnnotation].length;
  for (let i = 0; i < N; i++) {
    if (celltypeVisible[getCelltype(i)] !== false) visibleCells++;
  }

  const typeChips = selectedTypes.map(ct => {
    const hex = rgbToHex(celltypeColors[ct] || [128,128,128]);
    return `<span class="summary-chip"><span class="chip-dot" style="background:${hex}"></span>${ct}</span>`;
  }).join('');

  const nHl = highlightIdx ? highlightIdx.length : 0;
  const hlTxt = nHl ? ` · <span class="summary-count" style="color:#ffd54f">${nHl.toLocaleString()}</span> highlighted` : '';

  el.innerHTML = `<span class="summary-count">${selectedTypes.length}/${totalTypes}</span> types · ` +
    `<span class="summary-count">${visibleCells.toLocaleString()}</span>/${metadata.n_cells.toLocaleString()} cells` + hlTxt +
    `<div class="summary-types">${typeChips}</div>`;
}

// ============================================================================
// Start
// ============================================================================
init().catch(err => {
  document.getElementById('loading-text').textContent = 'Error: ' + err.message;
  console.error(err);
});
</script>
